<!DOCTYPE html>
<html lang="pt" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - Jango+ Sekulo</title>
    
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../assets/js/tailwind-config.js"></script>
    <script src="../assets/js/app.js" defer></script>
</head>
<body class="bg-background text-foreground font-sans min-h-screen pb-20">
    
    <div class="min-h-screen bg-background pb-12">
        <header class="px-5 pt-6 pb-4 flex items-center justify-between border-b border-border">
            <div>
                <div class="uppercase-tight text-[10px] text-muted-foreground">JANGO+</div>
                <div class="font-display text-base font-bold">PERFIL</div>
            </div>
            <a href="configuracoes.html" class="uppercase-tight text-[10px] text-muted-foreground hover:text-foreground">
                Config
            </a>
        </header>

        <main class="px-5 pt-6 space-y-6 max-w-md mx-auto">
            
            <section class="flex flex-col items-center text-center">
                <div class="h-24 w-24 rounded-full bg-muted flex items-center justify-center mb-4 border-4 border-border">
                    <span class="font-display text-3xl font-bold text-muted-foreground">👤</span>
                </div>
                <h1 id="profile-name" class="font-display text-2xl font-bold">Carregando...</h1>
                <p id="profile-email" class="text-sm text-muted-foreground mt-1">...</p>
            </section>

            <section class="grid grid-cols-2 gap-4 bg-card border border-border rounded-lg p-5 mt-6">
                <div>
                    <div class="uppercase-tight text-[10px] text-muted-foreground">XP Total</div>
                    <div id="profile-xp" class="font-display text-2xl font-bold mt-1 text-primary">0</div>
                </div>
                <div>
                    <div class="uppercase-tight text-[10px] text-muted-foreground">Liga</div>
                    <div id="profile-league" class="font-display text-lg font-bold mt-1 uppercase text-sekulo">Bronze</div>
                </div>
            </section>

            <section class="bg-card border border-border rounded-lg p-5">
                <h2 class="uppercase-tight text-xs mb-4">Estatísticas Detalhadas</h2>
                <div class="space-y-3">
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-muted-foreground">Taxa de Acerto Geral</span>
                        <span class="font-mono">--%</span>
                    </div>
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-muted-foreground">Missões Completadas</span>
                        <span class="font-mono">--</span>
                    </div>
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-muted-foreground">Simulados Realizados</span>
                        <span class="font-mono">--</span>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 bg-card border-t border-border z-50">
        <div class="max-w-md mx-auto flex items-center justify-around h-16 px-4 text-xs font-medium text-muted-foreground">
            <a href="dashboard.html" class="flex flex-col items-center gap-1 transition-colors hover:text-foreground">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                <span>Home</span>
            </a>
            <a href="roadmap.html" class="flex flex-col items-center gap-1 transition-colors hover:text-foreground">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s-8-4.5-8-11.8A8 8 0 0 1 12 2a8 8 0 0 1 8 8.2c0 7.3-8 11.8-8 11.8z"/><circle cx="12" cy="10" r="3"/></svg>
                <span>Roadmap</span>
            </a>
            <a href="sekulo.html" class="flex flex-col items-center gap-1 transition-colors hover:text-foreground">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                <span>Missão</span>
            </a>
            <a href="perfil.html" class="flex flex-col items-center gap-1 text-foreground transition-colors hover:text-foreground">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <span>Perfil</span>
            </a>
        </div>
    </nav>
</body>
</html>
