<!DOCTYPE html>
<html lang="pt" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roadmap - Jango+ Sekulo</title>
    
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../assets/js/tailwind-config.js"></script>
</head>
<body class="bg-background text-foreground font-sans min-h-screen pb-20">
    
    <div class="min-h-screen bg-background pb-12">
        <header class="px-5 pt-6 pb-4 flex items-center justify-between border-b border-border">
            <div>
                <div class="uppercase-tight text-[10px] text-muted-foreground">JANGO+</div>
                <div class="font-display text-base font-bold">ROADMAP</div>
            </div>
        </header>

        <main class="px-5 pt-6 space-y-6 max-w-md mx-auto">
            <div class="mb-6">
                <h2 class="font-display text-xl font-bold">A tua Jornada</h2>
                <p class="text-sm text-muted-foreground mt-1">Domina os tópicos chave do exame.</p>
            </div>

            <!-- Roadmap Items -->
            <div class="relative border-l-2 border-border ml-3 space-y-8">
                
                <div class="relative pl-6">
                    <div class="absolute -left-[9px] top-1 h-4 w-4 rounded-full bg-success ring-4 ring-background"></div>
                    <div class="bg-card border border-success/30 rounded-lg p-4">
                        <div class="flex items-center justify-between mb-2">
                            <span class="uppercase-tight text-[10px] text-success">Matemática</span>
                            <span class="text-xs font-mono">100%</span>
                        </div>
                        <h3 class="font-bold">Funções Reais</h3>
                        <p class="text-xs text-muted-foreground mt-1">Domínio concluído.</p>
                    </div>
                </div>

                <div class="relative pl-6">
                    <div class="absolute -left-[9px] top-1 h-4 w-4 rounded-full bg-primary ring-4 ring-background animate-pulse"></div>
                    <div class="bg-card border border-primary/50 rounded-lg p-4 shadow-[0_0_15px_rgba(255,255,255,0.05)]">
                        <div class="flex items-center justify-between mb-2">
                            <span class="uppercase-tight text-[10px] text-primary">Física</span>
                            <span class="text-xs font-mono text-primary">Em Progresso</span>
                        </div>
                        <h3 class="font-bold">Cinemática</h3>
                        <p class="text-xs text-muted-foreground mt-1">Próximo passo: Movimento Circular.</p>
                        <button class="btn-primary w-full h-8 uppercase-tight text-[10px] mt-4">Continuar Módulo</button>
                    </div>
                </div>

                <div class="relative pl-6 opacity-60">
                    <div class="absolute -left-[9px] top-1 h-4 w-4 rounded-full bg-muted ring-4 ring-background"></div>
                    <div class="bg-card border border-border rounded-lg p-4">
                        <div class="flex items-center justify-between mb-2">
                            <span class="uppercase-tight text-[10px] text-muted-foreground">Química</span>
                            <span class="text-xs font-mono">Bloqueado</span>
                        </div>
                        <h3 class="font-bold">Estequiometria</h3>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 bg-card border-t border-border z-50">
        <div class="max-w-md mx-auto flex items-center justify-around h-16 px-4 text-xs font-medium text-muted-foreground">
            <a href="dashboard.html" class="flex flex-col items-center gap-1 transition-colors hover:text-foreground">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                <span>Home</span>
            </a>
            <a href="roadmap.html" class="flex flex-col items-center gap-1 text-foreground transition-colors hover:text-foreground">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s-8-4.5-8-11.8A8 8 0 0 1 12 2a8 8 0 0 1 8 8.2c0 7.3-8 11.8-8 11.8z"/><circle cx="12" cy="10" r="3"/></svg>
                <span>Roadmap</span>
            </a>
            <a href="sekulo.html" class="flex flex-col items-center gap-1 transition-colors hover:text-foreground">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                <span>Missão</span>
            </a>
            <a href="perfil.html" class="flex flex-col items-center gap-1 transition-colors hover:text-foreground">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <span>Perfil</span>
            </a>
        </div>
    </nav>
</body>
</html>
