<!DOCTYPE html>
<html lang="pt" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações - Jango+ Sekulo</title>
    
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../assets/js/tailwind-config.js"></script>
    <script src="../assets/js/api-config.js"></script>
    <!-- Inclui app.js para o logout -->
    <script src="../assets/js/app.js" defer></script>
</head>
<body class="bg-background text-foreground font-sans min-h-screen pb-20">
    
    <div class="min-h-screen bg-background pb-12 md:pl-64">
        <!-- Header -->
        <header class="px-5 pt-6 pb-4 md:px-8 md:py-6 flex items-center border-b border-border max-w-md md:max-w-5xl mx-auto">
            <div>
                <div class="uppercase-tight text-[10px] text-muted-foreground">JANGO+</div>
                <div class="font-display text-base font-bold">CONFIGURAÇÕES</div>
            </div>
        </header>

        <main class="px-5 pt-6 pb-12 md:px-8 md:py-8 space-y-6 max-w-md md:max-w-5xl mx-auto">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- FORMULÁRIO 1: CONTA -->
                <form id="settings-profile-form" class="bg-card border border-border rounded-xl p-5 space-y-4 h-fit">
                    <h3 class="font-display font-bold text-sm tracking-wide text-foreground border-b border-border pb-2 uppercase-tight">Dados da Conta</h3>
                    
                    <div class="space-y-1">
                        <label class="text-[10px] uppercase-tight text-muted-foreground font-semibold">Nome de Exibição</label>
                        <input id="settings-display-name" type="text" class="w-full h-10 px-3 bg-muted/20 border border-border rounded-lg text-xs focus:border-primary focus:outline-none" required placeholder="Teu nome completo">
                    </div>

                    <div class="space-y-1">
                        <label class="text-[10px] uppercase-tight text-muted-foreground font-semibold">Nova Senha (deixar vazio se não quiser alterar)</label>
                        <input id="settings-password" type="password" class="w-full h-10 px-3 bg-muted/20 border border-border rounded-lg text-xs focus:border-primary focus:outline-none" placeholder="Pelo menos 6 caracteres">
                    </div>

                    <div id="settings-profile-error" class="hidden text-[10px] text-destructive font-medium"></div>
                    <div id="settings-profile-success" class="hidden text-[10px] text-success font-medium"></div>

                    <button type="submit" class="btn-primary w-full h-9 uppercase-tight text-[10px] font-bold">Gravar Alterações de Perfil</button>
                </form>

                <!-- FORMULÁRIO 2: METAS ACADÉMICAS -->
                <form id="settings-goals-form" class="bg-card border border-border rounded-xl p-5 space-y-4 h-fit">
                    <h3 class="font-display font-bold text-sm tracking-wide text-foreground border-b border-border pb-2 uppercase-tight">Metas Académicas e Rumo Profissional</h3>
                    
                    <div class="space-y-1">
                        <label class="text-[10px] uppercase-tight text-muted-foreground font-semibold">Universidade Alvo</label>
                        <select id="settings-university" class="w-full h-10 px-3 bg-muted/20 border border-border rounded-lg text-xs focus:border-primary focus:outline-none text-foreground bg-card">
                            <option value="Universidade Agostinho Neto - UAN">Universidade Agostinho Neto - UAN</option>
                            <option value="Universidade Católica de Angola - UCAN">Universidade Católica de Angola - UCAN</option>
                            <option value="Universidade Metodista de Angola">Universidade Metodista de Angola</option>
                            <option value="Universidade Lusíada de Angola">Universidade Lusíada de Angola</option>
                            <option value="Instituto Superior Politécnico Tundavala">Instituto Superior Politécnico Tundavala</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div class="space-y-1">
                            <label class="text-[10px] uppercase-tight text-muted-foreground font-semibold">Área</label>
                            <select id="settings-category" class="w-full h-10 px-3 bg-muted/20 border border-border rounded-lg text-xs focus:border-primary focus:outline-none text-foreground bg-card">
                                <option value="Engenharia">Engenharia</option>
                                <option value="Ciencias">Ciências Exactas/Naturais</option>
                                <option value="Saude">Ciências de Saúde</option>
                                <option value="Sociais">Ciências Sociais/Humanas</option>
                                <option value="Economicas">Ciências Económicas</option>
                            </select>
                        </div>
                        <div class="space-y-1">
                            <label class="text-[10px] uppercase-tight text-muted-foreground font-semibold">Horas de Estudo / Dia</label>
                            <select id="settings-hours" class="w-full h-10 px-3 bg-muted/20 border border-border rounded-lg text-xs focus:border-primary focus:outline-none text-foreground bg-card">
                                <option value="1">1 hora</option>
                                <option value="2" selected>2 horas</option>
                                <option value="3">3 horas</option>
                                <option value="4">4 horas</option>
                                <option value="6">6 horas</option>
                                <option value="8">8 horas</option>
                            </select>
                        </div>
                    </div>

                    <div class="space-y-1">
                        <label class="text-[10px] uppercase-tight text-muted-foreground font-semibold">Curso Específico</label>
                        <input id="settings-course" type="text" class="w-full h-10 px-3 bg-muted/20 border border-border rounded-lg text-xs focus:border-primary focus:outline-none" required placeholder="Ex: Engenharia Informática, Medicina">
                    </div>

                    <div class="space-y-1">
                        <label class="text-[10px] uppercase-tight text-muted-foreground font-semibold">Motivação Curta</label>
                        <textarea id="settings-motivation" rows="2" class="w-full p-3 bg-muted/20 border border-border rounded-lg text-xs focus:border-primary focus:outline-none resize-none" placeholder="O teu combustível para estudar..."></textarea>
                    </div>

                    <div class="flex items-start gap-3 py-1">
                        <input type="checkbox" id="settings-regenerate" class="rounded border-border text-primary focus:ring-primary h-4 w-4 bg-muted/20 mt-0.5">
                        <label for="settings-regenerate" class="text-[10px] text-muted-foreground leading-snug cursor-pointer select-none">
                            <strong>Regenerar Roadmap automaticamente</strong><br>
                            Recalcular matérias com base no novo curso/universidade.
                        </label>
                    </div>

                    <div id="settings-goals-error" class="hidden text-[10px] text-destructive font-medium"></div>
                    <div id="settings-goals-success" class="hidden text-[10px] text-success font-medium"></div>

                    <button type="submit" class="btn-primary w-full h-9 uppercase-tight text-[10px] font-bold bg-success hover:bg-success-hover border-success/30">Atualizar Plano de Estudos</button>
                </form>
            </div>

        </main>
    </div>

    <!-- Navigation Sidebar / Bottom Bar -->
    <nav class="fixed bottom-0 left-0 right-0 md:top-0 md:bottom-auto md:right-auto md:w-64 md:h-screen bg-card border-t md:border-t-0 md:border-r border-border z-50 transition-all duration-300">
        <div class="max-w-md md:max-w-none mx-auto md:mx-0 flex md:flex-col items-center justify-around md:justify-start md:items-stretch h-16 md:h-full px-4 md:px-6 md:py-8 text-xs font-medium text-muted-foreground gap-6">
            <!-- Logo inside sidebar (hidden on mobile, visible on desktop) -->
            <div class="hidden md:flex flex-col mb-8 border-b border-border pb-4">
                <span class="uppercase-tight text-[10px] text-muted-foreground">JANGO+</span>
                <span class="font-display text-lg font-bold text-foreground">SEKULO</span>
            </div>
            
            <a href="dashboard.html" class="flex flex-col md:flex-row items-center md:items-center gap-1 md:gap-3 transition-colors hover:text-foreground md:py-3 md:px-4 md:rounded-lg md:hover:bg-muted/30">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                <span class="md:text-sm md:font-semibold">Home</span>
            </a>
            <a href="roadmap.html" class="flex flex-col md:flex-row items-center md:items-center gap-1 md:gap-3 transition-colors hover:text-foreground md:py-3 md:px-4 md:rounded-lg md:hover:bg-muted/30">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s-8-4.5-8-11.8A8 8 0 0 1 12 2a8 8 0 0 1 8 8.2c0 7.3-8 11.8-8 11.8z"/><circle cx="12" cy="10" r="3"/></svg>
                <span class="md:text-sm md:font-semibold">Roadmap</span>
            </a>
            <a href="sekulo.html" class="flex flex-col md:flex-row items-center md:items-center gap-1 md:gap-3 transition-colors hover:text-foreground md:py-3 md:px-4 md:rounded-lg md:hover:bg-muted/30">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                <span class="md:text-sm md:font-semibold">Missão</span>
            </a>
            <a href="metricas.html" class="flex flex-col md:flex-row items-center md:items-center gap-1 md:gap-3 transition-colors hover:text-foreground md:py-3 md:px-4 md:rounded-lg md:hover:bg-muted/30">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                <span class="md:text-sm md:font-semibold">Métricas</span>
            </a>
            <a href="perfil.html" class="flex flex-col md:flex-row items-center md:items-center gap-1 md:gap-3 transition-colors hover:text-foreground md:py-3 md:px-4 md:rounded-lg md:hover:bg-muted/30">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <span class="md:text-sm md:font-semibold">Perfil</span>
            </a>

            <!-- Botão Sair -->
            <button id="logout-btn" class="md:mt-auto flex flex-col md:flex-row items-center md:items-center gap-1 md:gap-3 md:py-3 md:px-4 md:rounded-lg transition-colors text-destructive/60 hover:text-destructive hover:bg-destructive/10 md:border-t md:border-border md:pt-4">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                <span class="md:text-sm md:font-semibold">Sair</span>
            </button>
        </div>
    </nav>
</body>
</html>
